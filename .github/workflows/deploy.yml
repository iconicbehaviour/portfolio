name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages is static; the live Digital Twin runs as a Netlify function (CORS allows this origin).
      # If the function is unreachable the page falls back to its static Q&A.
      PUBLIC_TWIN_API: https://iconicbehaviour.netlify.app/api/twin
    steps:
      - uses: actions/checkout@v4
      # Builds the site, then runs scripts/check-site.mjs (broken links/images fail the build).
      - uses: withastro/action@v5
        with:
          # Astro 7 needs Node >=22.23.4; "22" can resolve to an older patch on the runner, so use 24.
          node-version: 24
          build-cmd: npm run build:ci

  deploy:
    # Pull requests only build and check; merging to main deploys.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
